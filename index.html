<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- セキュリティ：情報の外部持ち出しを遮断。許可する接続先はFirebase(Google)のみ -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.googleapis.com https://*.gstatic.com https://firestore.googleapis.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<!-- iOS ホーム画面追加用 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="コエタスク">
<title>コエタスク</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    --bg:#0b1020; --card:#161d33; --card2:#1e2846; --line:#2b3557;
    --txt:#eaf0ff; --sub:#8b96b8; --accent:#4f8cff; --accent2:#6aa0ff;
    --ok:#37d19b; --warn:#ffb84d; --danger:#ff5d6c; --radius:18px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    background:linear-gradient(180deg,#0b1020,#0e1428 60%,#0b1020);
    color:var(--txt);
    font-family:-apple-system,"Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:calc(var(--safe-t) + 14px) 14px calc(var(--safe-b) + 120px);
    max-width:640px; margin:0 auto; min-height:100%;
  }
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  h1{font-size:22px; margin:0; letter-spacing:.5px;}
  h1 .dot{color:var(--accent);}
  .today{font-size:13px; color:var(--sub);}
  .tabs{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0 10px;}
  .tab{border:1px solid var(--line); background:var(--card); color:var(--sub);
       border-radius:12px; padding:10px; font-size:14px; font-weight:700;}
  .tab.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .view{display:none;}
  .view.on{display:block;}

  /* サマリー帯 */
  .summary{display:flex; gap:8px; margin:14px 0;}
  .chip{flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px;
        padding:10px 8px; text-align:center;}
  .chip b{display:block; font-size:22px; line-height:1.1;}
  .chip span{font-size:11px; color:var(--sub);}
  .chip.overdue b{color:var(--danger);}
  .chip.today b{color:var(--warn);}
  .chip.done b{color:var(--ok);}

  /* グループ見出し */
  .group{margin:18px 0 8px; font-size:13px; color:var(--sub); font-weight:700;
         display:flex; align-items:center; gap:8px;}
  .group::after{content:""; flex:1; height:1px; background:var(--line);}
  .group .cnt{background:var(--card2); color:var(--sub); border-radius:20px; padding:1px 9px; font-size:12px;}
  .group.overdue{color:var(--danger);}
  .group.today{color:var(--warn);}

  /* タスクカード */
  ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  li{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
     padding:12px 14px; display:flex; align-items:center; gap:12px; transition:opacity .2s;}
  li.done{opacity:.45;}
  li.od{border-color:#5a2530; background:linear-gradient(90deg,#231320,#161d33 40%);}
  .check{width:26px; height:26px; border-radius:50%; border:2px solid var(--sub);
         flex:none; display:grid; place-items:center; font-size:15px; color:transparent;}
  li.done .check{background:var(--ok); border-color:var(--ok); color:#06251a;}
  .body{flex:1; min-width:0;}
  .ttl{font-size:16px; line-height:1.35; word-break:break-word;}
  li.done .ttl{text-decoration:line-through;}
  .meta{font-size:12px; color:var(--sub); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap;}
  .meta .when.od{color:var(--danger); font-weight:700;}
  .meta .when.soon{color:var(--warn); font-weight:700;}
  .meta .rep{color:var(--accent2);}
  .cal{font-size:19px; padding:4px 4px; flex:none; opacity:.85;}
  .del{color:var(--sub); font-size:20px; padding:4px 6px; flex:none;}
  .empty{text-align:center; color:var(--sub); padding:40px 10px; font-size:14px;}
  .sharebox{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
            padding:14px; margin:10px 0 12px;}
  .sharegrid{display:grid; grid-template-columns:1fr; gap:8px;}
  .shareinput,.shareselect,.sharetextarea{width:100%; background:var(--card2); border:1px solid var(--line);
            color:var(--txt); border-radius:12px; padding:12px 14px; font-size:15px; outline:none;}
  .sharetextarea{min-height:82px; resize:vertical; line-height:1.5;}
  .shareactions{display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap;}
  .shareadd{border:none; background:var(--accent); color:#fff; border-radius:12px; padding:12px 18px; font-size:15px;}
  .miniopt{display:flex; align-items:center; gap:8px; color:var(--sub); font-size:13px;}
  .miniopt input{width:18px; height:18px;}
  .shareitem{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
             padding:12px 14px; display:block;}
  .sharetop{display:flex; align-items:flex-start; gap:10px;}
  .sharebody{flex:1; min-width:0;}
  .sharetitle{font-size:16px; font-weight:700; line-height:1.35; word-break:break-word;}
  .sharetext{font-size:13px; color:var(--sub); white-space:pre-wrap; line-height:1.55; margin-top:5px;}
  .sharelink{display:inline-block; margin-top:7px; color:var(--accent2); font-size:13px; word-break:break-all;}
  .badge{display:inline-block; border:1px solid var(--line); color:var(--sub); border-radius:999px;
         padding:2px 8px; font-size:11px; margin-top:8px; margin-right:6px;}
  .badge.monthly{color:var(--accent2); border-color:#315f9f;}

  /* 下部固定バー */
  .bar{position:fixed; left:0; right:0; bottom:0; z-index:20;
       padding:10px 14px calc(var(--safe-b) + 12px);
       background:linear-gradient(180deg,rgba(11,16,32,0),#0b1020 30%);
       display:flex; gap:10px; align-items:center; max-width:640px; margin:0 auto;}
  .addtxt{flex:1; background:var(--card2); border:1px solid var(--line); border-radius:30px;
          color:var(--txt); font-size:16px; padding:14px 18px; outline:none;}
  .mic{width:62px; height:62px; border-radius:50%; flex:none; border:none; color:#fff;
       background:radial-gradient(circle at 30% 30%,var(--accent2),var(--accent));
       font-size:26px; box-shadow:0 8px 24px rgba(79,140,255,.45);}
  .mic:active{transform:scale(.94);}
  .mic.rec{background:radial-gradient(circle at 30% 30%,#ff8a94,var(--danger));
           box-shadow:0 0 0 0 rgba(255,93,108,.6); animation:pulse 1.1s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,93,108,.55)} 70%{box-shadow:0 0 0 22px rgba(255,93,108,0)} 100%{box-shadow:0 0 0 0 rgba(255,93,108,0)}}

  /* 音声中オーバーレイ */
  .listening{position:fixed; inset:0; z-index:30; display:none; flex-direction:column;
             align-items:center; justify-content:center; gap:18px;
             background:rgba(6,10,22,.82); backdrop-filter:blur(6px); text-align:center; padding:24px;}
  .listening.on{display:flex;}
  .wave{font-size:60px; animation:bob 1s ease-in-out infinite;}
  @keyframes bob{50%{transform:translateY(-10px)}}
  .heard{font-size:20px; min-height:28px; color:var(--accent2); max-width:90%;}
  .hint{color:var(--sub); font-size:13px; line-height:1.7;}
  .closeL{margin-top:8px; border:1px solid var(--line); background:var(--card2); color:var(--txt);
          padding:10px 22px; border-radius:30px; font-size:15px;}
  .gear{background:var(--card2); border:1px solid var(--line); color:var(--txt);
        width:38px; height:38px; border-radius:12px; font-size:18px; flex:none;}
  .sheet{position:fixed; inset:0; z-index:35; display:none;
         background:rgba(6,10,22,.7); backdrop-filter:blur(4px);
         align-items:flex-end; justify-content:center;}
  .sheet.on{display:flex;}
  .sheet .panel{background:var(--card); border:1px solid var(--line);
        border-radius:22px 22px 0 0; width:100%; max-width:640px;
        padding:18px 18px calc(var(--safe-b) + 22px);}
  .sheet h2{font-size:16px; margin:2px 0 4px;}
  .sheet p{color:var(--sub); font-size:12px; margin:0 0 12px;}
  .opt{display:flex; align-items:center; gap:12px; padding:12px 6px; border-top:1px solid var(--line); font-size:16px;}
  .opt .sw{width:46px; height:28px; border-radius:20px; background:var(--card2);
           border:1px solid var(--line); position:relative; flex:none; transition:.2s;}
  .opt .sw::after{content:""; position:absolute; top:2px; left:2px; width:22px; height:22px;
           border-radius:50%; background:var(--sub); transition:.2s;}
  .opt.on .sw{background:var(--accent);}
  .opt.on .sw::after{left:20px; background:#fff;}
  .tstat{font-size:13px; padding:8px 12px; border-radius:10px; background:var(--card2);
         border:1px solid var(--line); color:var(--sub); margin-bottom:10px;}
  .tstat.live{color:var(--ok); border-color:#245a45;}
  .trow{display:flex; gap:8px;}
  .tinput{flex:1; background:var(--card2); border:1px solid var(--line); border-radius:12px;
          color:var(--txt); font-size:15px; padding:12px 14px; outline:none;}
  .tbtn{border:none; background:var(--accent); color:#fff; font-size:15px; padding:0 20px; border-radius:12px; flex:none;}
  .tbtn.leave{background:var(--danger);}
  .sheet .close{margin-top:16px; width:100%; border:none; background:var(--accent);
           color:#fff; font-size:16px; padding:14px; border-radius:14px;}
  .toast{position:fixed; left:50%; bottom:calc(var(--safe-b) + 100px); transform:translateX(-50%);
         background:var(--card2); border:1px solid var(--line); color:var(--txt); padding:10px 18px;
         border-radius:30px; font-size:14px; opacity:0; transition:opacity .25s; z-index:40; pointer-events:none;}
  .toast.on{opacity:1;}
  button{font-family:inherit;}
</style>
</head>
<body>
<header>
  <h1>コエ<span class="dot">・</span>タスク</h1>
  <div style="display:flex; align-items:center; gap:10px;">
    <div class="today" id="todayLabel"></div>
    <button class="gear" id="gear" aria-label="通知設定">⚙️</button>
  </div>
</header>

<div class="tabs">
  <button class="tab on" id="tabTasks">タスク</button>
  <button class="tab" id="tabShared">共有</button>
</div>

<main id="taskView" class="view on">
  <div class="summary">
    <div class="chip overdue"><b id="cOver">0</b><span>期限切れ</span></div>
    <div class="chip today"><b id="cToday">0</b><span>今日</span></div>
    <div class="chip"><b id="cUp">0</b><span>今後</span></div>
    <div class="chip done"><b id="cDone">0</b><span>完了</span></div>
  </div>
  <div id="list"></div>
</main>

<main id="sharedView" class="view">
  <div class="sharebox">
    <div class="sharegrid">
      <select class="shareselect" id="shareScope">
        <option value="month">今月の重要事項</option>
        <option value="week">今週の重要事項</option>
        <option value="regular">定期確認</option>
      </select>
      <input class="shareinput" id="shareTitle" placeholder="件名">
      <input class="shareinput" id="shareUrl" placeholder="URL（任意）" inputmode="url" autocapitalize="off" autocorrect="off">
      <textarea class="sharetextarea" id="shareNote" placeholder="確認事項・メモ"></textarea>
    </div>
    <div class="shareactions">
      <label class="miniopt"><input type="checkbox" id="shareMonthly"> 毎月表示</label>
      <button class="shareadd" id="shareAdd">共有ページに追加</button>
    </div>
  </div>
  <div id="sharedList"></div>
</main>

<div class="bar">
  <input class="addtxt" id="addtxt" placeholder="手入力もできます" enterkeyhint="done">
  <button class="mic" id="mic" aria-label="音声入力">🎙️</button>
</div>

<div class="listening" id="listening">
  <div class="wave">🎙️</div>
  <div class="heard" id="heard">お話しください…</div>
  <div class="hint">
    例）「明日の15時に歯医者」<br>
    「来週月曜 資料提出」<br>
    「30分後に休憩」／「今日中に請求書」
  </div>
  <button class="closeL" id="closeL">閉じる</button>
</div>

<div class="sheet" id="sheet">
  <div class="panel">
    <h2>チーム共有</h2>
    <p>同じ「チームコード（合言葉）」を入力した端末どうしで、予定をリアルタイム共有します（iPhone / Android / Windows 共通）。</p>
    <div id="teamStatus" class="tstat">個人モード（この端末のみ）</div>
    <div class="trow">
      <input class="tinput" id="teamCode" placeholder="チームコード（例：kazoku2026）" autocapitalize="off" autocorrect="off">
      <button class="tbtn" id="teamBtn">参加</button>
    </div>

    <h2 style="margin-top:20px;">通知タイミング</h2>
    <p>📅でカレンダー登録した予定に、選択したタイミングでOS通知が届きます（複数選択可）。</p>
    <div id="opts"></div>
    <button class="close" id="sheetClose">完了</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js" defer></script>
</body>
</html>
